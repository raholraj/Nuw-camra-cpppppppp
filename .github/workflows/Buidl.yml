name: Build Debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build JCA Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip *.zip
          echo "--- Extracted contents ---"
          ls -la

      - name: Find and build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          echo "Found gradlew at: $GRADLEW_PATH"
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          echo "Build dir: $BUILD_DIR"
          cd "$BUILD_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
          retention-days: 7
