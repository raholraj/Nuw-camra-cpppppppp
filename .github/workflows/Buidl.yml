name: Build Debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build JCA Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip jca-dual-camera.zip
          ls -la

      - name: Find gradlew
        run: find . -name "gradlew" -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          cd jetpack-camera-app-main
          chmod +x ./gradlew

      - name: Build debug APK
        run: |
          cd jetpack-camera-app-main
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            jetpack-camera-app-main/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
